<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:var(--font-sans,Inter,system-ui,sans-serif)}
  .frame{position:relative;width:100%;overflow:hidden;border-radius:10px;border:1px solid #ddd;margin-top:12px}
  .frame>.screen{position:absolute;top:0;left:0;width:1280px;transform-origin:0 0;overflow:hidden}
  .screen *{box-sizing:border-box}
  .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
  .serif{font-family:'Source Serif 4',Georgia,serif}
  .pre{white-space:pre}
  @keyframes pulse{50%{opacity:.35}} .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes dash{to{stroke-dashoffset:-24}} .flow{stroke-dasharray:4 8;animation:dash 1s linear infinite}
  @keyframes blink{50%{opacity:0}} .caret{display:inline-block;width:8px;height:16px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
  section{margin:0 0 56px} h2{font-size:18px;margin:0 0 4px} p.d{margin:0;font-size:13.5px;line-height:1.55;color:#666}
  .cap{font-size:12px;color:#777;margin-top:5px}
</style></head><body><div id="root"></div>
<script>
const TAU=Math.PI*2;
const P=(cx,cy,r)=>{let a=[];for(let i=0;i<7;i++){const t=-Math.PI/2+i*TAU/7;a.push((cx+r*Math.cos(t)).toFixed(1)+','+(cy+r*Math.sin(t)).toFixed(1))}return a.join(' ')};
const wheel=(cx,cy,r,bg,fg)=>{let s=`<polygon points="${P(cx,cy,r)}" fill="${bg}" stroke="${bg}" stroke-width="${r*.22}" stroke-linejoin="round"/><circle cx="${cx}" cy="${cy}" r="${r*.44}" fill="none" stroke="${fg}" stroke-width="${r*.12}"/>`;for(let i=0;i<7;i++){const t=-Math.PI/2+i*TAU/7;s+=`<line x1="${cx+r*.14*Math.cos(t)}" y1="${cy+r*.14*Math.sin(t)}" x2="${cx+r*.72*Math.cos(t)}" y2="${cy+r*.72*Math.sin(t)}" stroke="${fg}" stroke-width="${r*.1}" stroke-linecap="round"/>`}return s+`<circle cx="${cx}" cy="${cy}" r="${r*.14}" fill="${fg}"/>`};
const logo=(size,bg='#326ce5',fg='#fff')=>`<svg width="${size}" height="${size}" viewBox="0 0 40 40" style="display:block;flex:none">${wheel(20,20,16,bg,fg)}</svg>`;
const pad=(s,n)=>String(s).padEnd(n,' ');

/* Official-style Kubernetes icon: rounded blue heptagon, white glyph, lowercase label. */
function kicon(cx,cy,r,kind,o={}){const fill=o.fill||'#326ce5',bg=o.bg||'#fff',ghost=o.ghost,col=o.col||fill,g=ghost?col:'#fff';
 let s=`<polygon points="${P(cx,cy,r)}" fill="${ghost?bg:fill}" stroke="${ghost?col:fill}" stroke-width="${ghost?1.6:r*.24}" stroke-linejoin="round" ${o.dash?'stroke-dasharray="3 3"':''} ${o.cls?`class="${o.cls}"`:''} opacity="${o.op??1}"/>`;
 const w=Math.max(1.2,r*.08);
 if(kind=='pod')s+=`<path d="M ${cx-r*.36} ${cy-r*.3} l ${r*.36} ${-r*.18} l ${r*.36} ${r*.18} v ${r*.42} l ${-r*.36} ${r*.18} l ${-r*.36} ${-r*.18} z M ${cx-r*.36} ${cy-r*.3} l ${r*.36} ${r*.18} l ${r*.36} ${-r*.18} M ${cx} ${cy-r*.12} v ${r*.6}" fill="none" stroke="${g}" stroke-width="${w}" stroke-linejoin="round" opacity="${o.op??1}"/>`;
 else if(kind=='svc')s+=`<rect x="${cx-r*.42}" y="${cy-r*.12}" width="${r*.84}" height="${r*.32}" fill="none" stroke="${g}" stroke-width="${w}"/><path d="M ${cx} ${cy-r*.12} v ${-r*.24} M ${cx-r*.3} ${cy+r*.2} v ${r*.18} M ${cx+r*.3} ${cy+r*.2} v ${r*.18}" stroke="${g}" stroke-width="${w}"/>`;
 else if(kind=='node')s+=`<rect x="${cx-r*.4}" y="${cy-r*.36}" width="${r*.8}" height="${r*.6}" rx="${r*.06}" fill="none" stroke="${g}" stroke-width="${w}"/><path d="M ${cx-r*.25} ${cy-r*.1} h ${r*.5}" stroke="${g}" stroke-width="${w}"/>`;
 else if(kind=='rs'||kind=='deploy')s+=`<rect x="${cx-r*.28}" y="${cy-r*.36}" width="${r*.5}" height="${r*.5}" fill="none" stroke="${g}" stroke-width="${w}"/><rect x="${cx-r*.18}" y="${cy-r*.24}" width="${r*.5}" height="${r*.5}" fill="${ghost?bg:fill}" stroke="${g}" stroke-width="${w}"/>`;
 if(o.label!==false&&r>=16)s+=`<text x="${cx}" y="${cy+r*.66}" text-anchor="middle" font-family="Inter" font-weight="600" font-size="${r*.28}" fill="${g}" opacity="${o.op??1}">${kind}</text>`;return s}

const LIGHT={bg:'#fff',node:'#fff',ink:'#111827',dim:'#6b7280',line:'#e5e7eb',accent:'#326ce5',ok:'#16a34a',warn:'#d97706',bad:'#dc2626',sys:'#c7ccd6'};
const DARK={bg:'#0b0d12',node:'#11141b',ink:'#e5e7eb',dim:'#8b93a7',line:'#232838',accent:'#4f86ff',ok:'#4ade80',warn:'#fbbf24',bad:'#f87171',sys:'#3a4152'};

/* The same cluster moment for every direction: 4jcsx Terminating, x7k2m ContainerCreating. */
function cluster(W,H,t,o={}){const padX=o.padX??30,gap=o.gap??28,nw=(W-2*padX-2*gap)/3,nh=o.nh??150,y0=o.y0??20,pr=o.pr??22,svcY=o.svcY??(y0+nh+70);
 let s='';const pods=[];
 ['control-plane','worker-1','worker-2'].forEach((n,i)=>{const x=padX+i*(nw+gap);
  s+=`<rect x="${x}" y="${y0}" width="${nw}" height="${nh}" rx="${o.rx??12}" fill="${t.node}" stroke="${t.line}" stroke-width="1.2"/>`;
  s+=`<text x="${x+16}" y="${y0+26}" font-family="Inter" font-weight="500" font-size="${o.fs??13}" fill="${t.ink}">${n}</text><circle cx="${x+nw-20}" cy="${y0+22}" r="3.5" fill="${t.ok}"/>`;
  if(i==0){for(let k=0;k<4;k++)s+=kicon(x+nw/2-54+k*36,y0+nh*.56,11,'pod',{fill:t.sys,label:false});s+=`<text x="${x+nw/2}" y="${y0+nh*.56+30}" text-anchor="middle" font-family="Inter" font-size="11" fill="${t.dim}">system</text>`}
  else [.33,.67].forEach((f,k)=>pods.push({x:x+nw*f,y:y0+nh*.55,st:i==1?(k==0?'run':'term'):(k==0?'run':'new'),id:i==1?(k==0?'hbzf9':'4jcsx'):(k==0?'8r7g5':'x7k2m')}))});
 // service
 const sx=W/2,sr=o.svcR??18;
 pods.filter(p=>p.st=='run').forEach(p=>s+=`<path d="M ${sx} ${svcY-sr} C ${sx} ${svcY-sr-50}, ${p.x} ${p.y+pr+60}, ${p.x} ${p.y+pr+(o.podLabel===false?6:26)}" fill="none" stroke="${t.accent}" stroke-opacity=".55" stroke-width="1.3" class="flow"/>`);
 s+=kicon(sx,svcY,sr,'svc',{fill:t.accent,bg:t.bg})+`<text x="${sx+sr+10}" y="${svcY+4}" font-family="Inter" font-weight="500" font-size="12" fill="${t.ink}">web</text>`;
 pods.forEach(p=>{const ks=p.st=='run'?{fill:t.accent}:p.st=='term'?{ghost:1,col:t.bad,dash:1,bg:t.node,op:.75}:{ghost:1,col:t.accent,bg:t.node,cls:'pulse'};
  s+=kicon(p.x,p.y,pr,'pod',ks);
  if(o.podLabel!==false){s+=`<text x="${p.x}" y="${p.y+pr+18}" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="${t.dim}">${p.id}</text>`;
   if(p.st!='run')s+=`<text x="${p.x}" y="${p.y+pr+32}" text-anchor="middle" font-family="Inter" font-size="10.5" fill="${p.st=='term'?t.bad:t.warn}">${p.st=='term'?'Terminating':'Creating'}</text>`}});
 return {svg:`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">${s}</svg>`,pods}}

const PODS=[['NAME','READY','STATUS','AGE'],['web-…hbzf9','1/1','Running','41s'],['web-…4jcsx','1/1','Terminating','41s'],['web-…8r7g5','1/1','Running','41s'],['web-…x7k2m','0/1','ContainerCreating','1s']];
const table=t=>PODS.map((r,i)=>`<div style="color:${i?t.ink:t.dim}">${pad(r[0],14)}${pad(r[1],8)}<span style="color:${i==0?t.dim:r[2]=='Running'?t.ok:r[2]=='Terminating'?t.bad:t.warn}">${pad(r[2],20)}</span>${r[3]}</div>`).join('');
const dots=(t,n=4,done=1,cur=1)=>`<span style="display:inline-flex;gap:5px;vertical-align:middle">${Array.from({length:n},(_,i)=>`<svg width="10" height="10" viewBox="0 0 10 10"><polygon points="${P(5,5,4.3)}" fill="${i<done?t.accent:i==cur?t.bg:t.line}" stroke="${i<=cur?t.accent:t.line}" stroke-width="1.2"/></svg>`).join('')}</span>`;

/* ===================== E · QUIET ===================== */
function E_app(){const t=LIGHT,c=cluster(1000,300,t,{y0:16,nh:150,pr:24,svcY:262});
 return `<div style="width:1280px;height:760px;background:#fff;font-family:Inter;color:${t.ink};display:flex;flex-direction:column">
 <div style="height:52px;display:flex;align-items:center;padding:0 24px;gap:10px;border-bottom:1px solid ${t.line}">${logo(22)}<span style="font-weight:600;font-size:15px">kubesim</span><span style="flex:1;text-align:center;font-size:13.5px;color:${t.dim}">Self-healing &nbsp; ${dots(t)}</span><span class="mono" style="font-size:12.5px;color:${t.dim}">0:41</span><span style="font-size:13px;color:${t.dim};margin-left:14px">Exit</span></div>
 <div style="text-align:center;padding:26px 0 6px"><div style="font-size:13px;color:${t.dim}">Step 2 of 4</div><div style="font-size:28px;font-weight:600;letter-spacing:-.6px;margin:6px 0 6px">Delete one of the web Pods.</div><div style="font-size:15.5px;color:${t.dim}">Pick any of the three, then watch what the cluster does about it.</div></div>
 <div style="display:flex;justify-content:center">${c.svg}</div>
 <div style="text-align:center;font-size:14px;color:${t.ink};margin-top:-4px"><span style="display:inline-block;width:7px;height:7px;border-radius:7px;background:${t.accent};margin-right:8px;vertical-align:1px"></span>The ReplicaSet saw 2 of 3 Pods and is creating <b class="mono" style="font-weight:500">x7k2m</b> on worker-2.</div>
 <div style="flex:1"></div>
 <div style="border-top:1px solid ${t.line};background:#fafafa;padding:12px 32px 14px;display:flex;gap:24px">
  <div class="mono pre" style="flex:1;font-size:12.5px;line-height:1.6"><div style="color:${t.dim}">$ kubectl delete pod web-5c5687b4dd-4jcsx</div><div style="color:${t.dim}">pod "web-5c5687b4dd-4jcsx" deleted</div><div style="color:${t.dim}">$ kubectl get pods</div>${table(t)}<div><span style="color:${t.accent}">$</span> <span class="caret" style="background:${t.ink}"></span></div></div>
  <div style="display:flex;flex-direction:column;gap:8px;font-size:13px;color:${t.dim};text-align:right"><span>Hint</span><span>YAML</span><span>Full terminal ↑</span></div></div></div>`}
function E_home(){const t=LIGHT,c=cluster(820,250,t,{y0:10,nh:130,pr:20,svcY:210,podLabel:false});
 return `<div style="width:1280px;height:600px;background:#fff;font-family:Inter;color:${t.ink};position:relative">
 <div style="height:64px;display:flex;align-items:center;padding:0 40px;gap:10px">${logo(26)}<span style="font-weight:600;font-size:16px">kubesim</span><span style="flex:1"></span><span style="font-size:14px;color:${t.dim};margin-right:24px">Lessons</span><span style="font-size:14px;color:${t.dim}">Sandbox</span></div>
 <div style="text-align:center;padding-top:56px"><div style="font-size:52px;font-weight:600;letter-spacing:-2px;line-height:1.08">Learn Kubernetes<br>on a cluster you can see.</div>
 <div style="font-size:17px;color:${t.dim};margin:16px 0 26px">It runs in this tab. Nothing to install, nothing to sign up for.</div>
 <span style="display:inline-block;background:${t.ink};color:#fff;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:500">Start the first lesson</span><span style="font-size:14.5px;color:${t.dim};margin-left:18px">or open an empty cluster</span></div>
 <div style="position:absolute;left:230px;bottom:-40px;opacity:.9">${c.svg}</div><div style="position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(#fff0,#fff)"></div></div>`}

/* ===================== F · NOTEBOOK ===================== */
function F_app(){const t=LIGHT,c=cluster(640,420,t,{padX:20,gap:18,y0:20,nh:170,pr:24,svcY:320});
 const done=(n,tx)=>`<div style="display:flex;gap:12px;align-items:center;color:${t.dim};font-size:15px;margin:0 0 14px"><svg width="20" height="20" viewBox="0 0 20 20"><polygon points="${P(10,10,8.5)}" fill="${t.accent}" stroke="${t.accent}" stroke-width="2" stroke-linejoin="round"/><path d="M6.3 10.4l2.4 2.3 5-5" stroke="#fff" stroke-width="1.7" fill="none"/></svg>${tx}</div>`;
 const todo=(n,tx)=>`<div style="display:flex;gap:12px;align-items:center;color:#9ca3af;font-size:15px;margin:0 0 12px"><svg width="20" height="20" viewBox="0 0 20 20"><polygon points="${P(10,10,8.5)}" fill="none" stroke="#d1d5db" stroke-width="1.3"/><text x="10" y="13.5" text-anchor="middle" font-size="9.5" font-family="Inter" fill="#9ca3af">${n}</text></svg>${tx}</div>`;
 return `<div style="width:1280px;height:760px;background:#fff;font-family:Inter;color:${t.ink};display:flex">
 <div style="width:600px;padding:30px 56px 0 64px;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:${t.dim}">${logo(20)}<span>Foundations</span><span>·</span><span>Lesson 3 of 5</span></div>
  <div class="serif" style="font-size:42px;font-weight:600;letter-spacing:-.6px;margin:30px 0 12px">Self-healing</div>
  <div class="serif" style="font-size:17.5px;line-height:1.65;color:#374151;margin-bottom:26px">A Deployment doesn't run Pods itself. It asks a <b style="font-weight:600">ReplicaSet</b> to keep a number of them alive, and the ReplicaSet keeps checking. Take one away and see how long it lasts.</div>
  ${done(1,'Create a Deployment called web with 3 replicas')}
  <div style="display:flex;gap:12px;align-items:flex-start;margin:4px 0 16px"><svg width="20" height="20" viewBox="0 0 20 20" style="flex:none;margin-top:2px"><polygon points="${P(10,10,8.5)}" fill="#fff" stroke="${t.accent}" stroke-width="1.8"/><text x="10" y="13.5" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Inter" fill="${t.accent}">2</text></svg><div style="flex:1"><div style="font-size:16px;font-weight:600">Delete one of the web Pods</div>
   <div class="mono pre" style="margin-top:12px;background:#f6f7f9;border-radius:10px;padding:14px 16px;font-size:12.5px;line-height:1.65"><div><span style="color:${t.accent}">$</span> kubectl delete pod web-5c5687b4dd-4jcsx</div><div style="color:${t.dim}">pod "web-5c5687b4dd-4jcsx" deleted</div><div><span style="color:${t.accent}">$</span> <span class="caret" style="background:${t.ink}"></span></div></div>
   <div style="font-size:13.5px;color:${t.ok};margin-top:10px">Done. Look right: a new Pod is already on its way.</div></div></div>
  ${todo(3,'Watch the ReplicaSet replace it')}${todo(4,'Scale web to 5 replicas')}
  <div style="flex:1"></div><div style="display:flex;justify-content:space-between;font-size:13.5px;color:${t.dim};padding:18px 0;border-top:1px solid ${t.line}"><span>← Health checks</span><span>Hint</span><span style="color:#9ca3af">Rolling updates →</span></div></div>
 <div style="flex:1;background:#f7f8fa;border-left:1px solid ${t.line};padding:24px 20px;display:flex;flex-direction:column">
  <div style="display:flex;font-size:12.5px;color:${t.dim};padding:0 20px"><span>Your cluster</span><span style="flex:1"></span><span class="mono">0:41 · 1×</span></div>
  <div style="margin-top:14px">${c.svg.replace(/fill="#fff" stroke="#e5e7eb"/g,'fill="#fff" stroke="#e5e7eb"')}</div>
  <div style="flex:1"></div>
  <div class="serif" style="font-size:15.5px;line-height:1.6;color:#374151;padding:0 20px 8px;font-style:italic">The ReplicaSet counted 2 of 3 Pods and created x7k2m. The scheduler put it on worker-2, which had the fewest Pods.</div></div></div>`}
function F_home(){const t=LIGHT;const tracks=[['Foundations','Pods, Deployments, Services, self-healing',5],['Workloads','Jobs, CronJobs, DaemonSets, probes',4],['Configuration','ConfigMaps and Secrets',2],['Networking','Ingress and NetworkPolicy',2],['Storage','Volumes and StatefulSets',2],['Operations','Scheduling, draining, autoscaling',3],['Security','RBAC',1]];
 return `<div style="width:1280px;height:600px;background:#fff;font-family:Inter;color:${t.ink};display:flex;padding:0 80px">
 <div style="width:520px;padding-top:44px"><div style="display:flex;align-items:center;gap:10px">${logo(26)}<span style="font-weight:600;font-size:16px">kubesim</span></div>
 <div class="serif" style="font-size:54px;font-weight:600;letter-spacing:-1.2px;line-height:1.06;margin:84px 0 20px">Learn Kubernetes,<br>one Pod at a time.</div>
 <div class="serif" style="font-size:18.5px;line-height:1.6;color:#4b5563">Short lessons on a real-feeling cluster that runs in your browser. Each one says what to do, checks that you did it, and explains what happened.</div>
 <div style="margin-top:30px;font-size:15px"><span style="background:${t.accent};color:#fff;border-radius:10px;padding:13px 22px;font-weight:500">Start lesson 1</span><span style="color:${t.dim};margin-left:18px">Free · no account</span></div></div>
 <div style="flex:1;padding:118px 0 0 90px"><div style="font-size:13px;color:${t.dim};margin-bottom:10px">The path</div>
 ${tracks.map((r,i)=>`<div style="display:flex;align-items:baseline;gap:16px;padding:11px 0;border-top:1px solid ${t.line}"><span class="mono" style="font-size:12px;color:${i==0?t.accent:'#9ca3af'};width:20px">0${i+1}</span><span style="font-size:16px;font-weight:500;width:140px">${r[0]}</span><span style="font-size:14px;color:${t.dim};flex:1">${r[1]}</span><span style="font-size:13px;color:#9ca3af">${r[2]}</span></div>`).join('')}</div></div>`}

/* ===================== G · GUIDED SHELL (dark) ===================== */
function G_app(){const t=DARK,c=cluster(1100,250,t,{padX:20,gap:28,y0:14,nh:150,pr:22,svcY:214,rx:10});
 const L=(x,col)=>`<div style="color:${col||t.ink}">${x}</div>`;
 return `<div style="width:1280px;height:760px;background:${t.bg};font-family:Inter;color:${t.ink};display:flex;flex-direction:column">
 <div style="height:48px;display:flex;align-items:center;padding:0 28px;gap:10px;border-bottom:1px solid ${t.line}">${logo(20,t.accent)}<span style="font-weight:600;font-size:14.5px">kubesim</span><span style="color:${t.dim};font-size:13.5px;margin-left:10px">Self-healing</span><span style="margin-left:12px">${dots(t)}</span><span style="flex:1"></span><span class="mono" style="font-size:12.5px;color:${t.dim}">0:41</span></div>
 <div style="display:flex;justify-content:center;padding-top:14px">${c.svg}</div>
 <div class="mono pre" style="flex:1;margin:10px 90px 0;padding:18px 0;border-top:1px solid ${t.line};font-size:13.5px;line-height:1.72">
${L('# Step 2 of 4 · Delete one of the web Pods',t.accent)}${L('# The Deployment wants 3. Remove one and see what happens.',t.dim)}${L('<span style="color:'+t.dim+'">$</span> kubectl delete pod web-5c5687b4dd-4jcsx')}${L('pod "web-5c5687b4dd-4jcsx" deleted',t.dim)}${L('✓ Step 2 done. The ReplicaSet is already creating x7k2m.',t.ok)}${L('')}${L('# Step 3 of 4 · Watch it get replaced. Try: kubectl get pods -w',t.accent)}${L('<span style="color:'+t.dim+'">$</span> <span class="caret" style="background:'+t.ink+'"></span>')}</div>
 <div style="height:40px;display:flex;align-items:center;gap:22px;padding:0 90px;font-size:12.5px;color:${t.dim};border-top:1px solid ${t.line}"><span>Tab completes</span><span>hint</span><span>yaml</span><span>Ctrl+C stops a watch</span></div></div>`}
function G_home(){const t=DARK;return `<div style="width:1280px;height:600px;background:${t.bg};font-family:Inter;color:${t.ink};position:relative">
 <div style="height:64px;display:flex;align-items:center;padding:0 40px;gap:10px">${logo(24,t.accent)}<span style="font-weight:600;font-size:15.5px">kubesim</span><span style="flex:1"></span><span style="font-size:14px;color:${t.dim};margin-right:24px">Lessons</span><span style="font-size:14px;color:${t.dim}">Sandbox</span></div>
 <div style="padding:90px 0 0 200px" class="mono"><div style="font-size:15px;color:${t.dim}">$ kubectl get nodes</div><div class="pre" style="font-size:15px;color:${t.dim};line-height:1.6;margin:6px 0 34px">NAME            STATUS   ROLES           AGE
control-plane   Ready    control-plane   0s
worker-1        Ready    &lt;none&gt;          0s
worker-2        Ready    &lt;none&gt;          0s</div>
 <div style="font-family:Inter;font-size:46px;font-weight:600;letter-spacing:-1.6px;line-height:1.1">A Kubernetes cluster just started<br>in this tab. It's yours to learn on.</div>
 <div style="margin-top:34px;font-size:16px"><span style="color:${t.accent}">$</span> <span style="color:${t.ink}">press Enter to start lesson 1</span><span class="caret" style="background:${t.ink};margin-left:6px"></span></div></div></div>`}

/* ===================== H · SPOTLIGHT ===================== */

fit();addEventListener('resize',fit);document.fonts&&document.fonts.ready.then(fit);
</script></body></html>
