  <style>

    @font-face {

    }
    #root {

    [id="02-cluster-reveal-svg"] {
      position: absolute;
      left: 0;

    [id="02-cluster-reveal-mark"] {
      position: absolute;

    [id="02-cluster-reveal-wordmark"] {

  </style>

  <div data-hf-id="hf-rlrz" id="root" data-composition-id="02-cluster-reveal" data-width="1080" data-height="1080" data-duration="5.5">
    <!-- Track 0: full-bleed ground. Canvas colour + the app dot grid (radiates in from the centre dot). -->
    <div data-hf-id="hf-wpfw" id="02-cluster-reveal-bg" class="clip 02-cluster-reveal-layer" data-start="0" data-duration="5.5" data-track-index="0">
      <div data-hf-id="hf-c2hl" id="02-cluster-reveal-grid"></div>
    </div>

    <!-- Track 1: the isometric cluster (built by IsoKit) + the opening dot. -->
    <div data-hf-id="hf-k8lm" id="02-cluster-reveal-stage" class="clip 02-cluster-reveal-layer" data-start="0" data-duration="5.5" data-track-index="1">
      <svg data-hf-id="hf-giwx" id="02-cluster-reveal-svg" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
        <g data-hf-id="hf-9xm3" id="02-cluster-reveal-intro">
          <circle data-hf-id="hf-68pq" id="02-cluster-reveal-ring" cx="540" cy="540" r="10" fill="none" stroke="#3B82F6" stroke-width="4" />
          <circle data-hf-id="hf-8l1c" id="02-cluster-reveal-dot" cx="540" cy="540" r="10" fill="#3B82F6" />
        </g>
      </svg>
    </div>

    <!-- Track 2: the lockup (mark + wordmark) and tagline, at the confirmed sketch positions. -->
    <div data-hf-id="hf-lvgl" id="02-cluster-reveal-lockup" class="clip 02-cluster-reveal-layer" data-start="0" data-duration="5.5" data-track-index="2">
      <svg data-hf-id="hf-9v9w" id="02-cluster-reveal-mark" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <path data-hf-id="hf-c2jc" d="M14 2.5l10 5.75v11.5L14 25.5 4 19.75V8.25L14 2.5z" fill="#0f172a" />
        <path data-hf-id="hf-ir13" id="02-cluster-reveal-mark-inner" d="M14 8l5.2 3v6L14 20l-5.2-3v-6L14 8z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" />
      </svg>
      <div data-hf-id="hf-ngve" id="02-cluster-reveal-wordmark">
        <span data-hf-id="hf-p7b2" class="02-cluster-reveal-letter">k</span><span data-hf-id="hf-l88s" class="02-cluster-reveal-letter">u</span><span data-hf-id="hf-rzg9" class="02-cluster-reveal-letter">b</span><span data-hf-id="hf-rl58" class="02-cluster-reveal-letter">e</span><span data-hf-id="hf-m0uu" class="02-cluster-reveal-letter">s</span><span data-hf-id="hf-pzx4" class="02-cluster-reveal-letter">i</span><span data-hf-id="hf-oep0" class="02-cluster-reveal-letter">m</span>
      </div>
      <div data-hf-id="hf-g2n1" id="02-cluster-reveal-tagline">
        <span data-hf-id="hf-za9d" class="02-cluster-reveal-word">Kubernetes</span><span data-hf-id="hf-92a0" class="02-cluster-reveal-word">you</span><span data-hf-id="hf-nk1l" class="02-cluster-reveal-word">can</span><span data-hf-id="hf-a506" class="02-cluster-reveal-word">see.</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/iso-kit.js"></script>
  <script>
    (function () {
      var FID = "02-cluster-reveal";
      var K = window.IsoKit;
      var C = K.COLORS;
      var byId = function (s) {
        return document.getElementById(FID + "-" + s);
      };
      var F = 1 / 60;

      var tl = gsap.timeline({ paused: true });

      // ---------- build ----------
      var grid = byId("grid");
      grid.style.cssText += K.DOT_GRID_CSS;

      var svg = byId("svg");
      var dot = byId("dot");
      var ring = byId("ring");

      // Cluster at the shared IsoKit geometry; end state = w2:[1] (continuity contract).
      var H = K.buildCluster(svg, { prefix: FID, pods: { w2: [1] } });
      var ORDER = ["cp", "w1", "w3", "w2"];

      // Pod on worker-2 slot 1: starts Pending (amber LED), flips to Running (green) after landing.
      var pod = H.podEls.w2[0];
      var led = pod.querySelector(".led");
      led.setAttribute("fill", C.amber);
      var podBX = pod.dataset.bx, podBY = pod.dataset.by;
      var podOrigin = podBX + " " + podBY;

      var layer = H.pods.w2;
      var sl = K.slot("w2", 1);
      var wx = sl[0] + K.POD / 2, wy = sl[1] + K.POD / 2;

      // Contact shadow (grows as the Pod falls; hidden once it lands under the cube).
      var shadow = K.isoRing(layer, wx, wy, K.NODE_H, 34, { fill: C.ink, stroke: "none" });
      shadow.style.opacity = "0";
      layer.insertBefore(shadow, pod);

      // Ground ripple ring on the slab plane.
      var ripple = K.isoRing(layer, wx, wy, K.NODE_H, 30, { stroke: C.blue[1], "stroke-width": 2.5 });
      ripple.style.opacity = "0";
      layer.insertBefore(ripple, pod);

      // Echo trail copies (speed read during the drop only).
      var echoes = [0.3, 0.14].map(function (op) {
        var e = pod.cloneNode(true);
        e.removeAttribute("id");
        e.setAttribute("class", "pod-echo");
        e.style.opacity = String(op);
        layer.insertBefore(e, pod);
        return e;
      });

      // Transform origins (SVG user space).
      gsap.set(dot, { svgOrigin: "540 540" });
      gsap.set(H.root, { svgOrigin: K.CX + " " + (K.CY - 10) });
      gsap.set([pod].concat(echoes), { svgOrigin: podOrigin });
      var sb = K.P(wx, wy, K.NODE_H);
      gsap.set(shadow, { svgOrigin: sb[0].toFixed(2) + " " + sb[1].toFixed(2) });
      var cpo = K.origin("cp");
      H.sys.forEach(function (b, i) {
        var s = K.SLOTS[i];
        var p = K.P(cpo[0] + s[0] + 26, cpo[1] + s[1] + 26, K.NODE_H);
        gsap.set(b, { svgOrigin: p[0].toFixed(2) + " " + p[1].toFixed(2) });
      });

      // ---------- Scene 1 (0.0–1.6s): dot → grid; slabs rise; system components pop ----------
      tl.fromTo(dot, { scale: 1 }, { scale: 0, duration: 0.32, ease: "power2.in" }, 0.06);
      tl.fromTo(
        ring,
        { attr: { r: 10, "stroke-width": 4 } },
        { attr: { r: 780, "stroke-width": 1 }, duration: 0.95, ease: "expo.out" },
        0.08
      );
      tl.fromTo(ring, { opacity: 0.9 }, { opacity: 0, duration: 0.8, ease: "power1.in" }, 0.08);
      tl.fromTo(
        grid,
        { clipPath: "circle(0px at 540px 540px)" },
        { clipPath: "circle(780px at 540px 540px)", duration: 0.95, ease: "expo.out" },
        0.08
      );

      // Whole-cluster camera pull-back feel: 0.9 → 1 on one long-tail settle.
      tl.fromTo(H.root, { scale: 0.9 }, { scale: 1, duration: 1.6, ease: "power3.out" }, 0);

      // Node slabs rise from below: control-plane, worker-1, worker-3, worker-2.
      ORDER.forEach(function (n, i) {
        tl.fromTo(
          H.nodes[n],
          { y: 260, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.95, ease: "expo.out" },
          0.12 + i * 0.15
        );
      });

      // Violet system components pop onto the control-plane in quick succession.
      H.sys.forEach(function (b, i) {
        tl.fromTo(b, { scale: 0 }, { scale: 1, duration: 0.42, ease: "power3.out" }, 0.62 + i * 0.09);
      });

      // ---------- Scene 2 (1.6–2.6s): first Pod drops onto worker-2 slot 1 ----------
      var DROP_AT = 1.62, FALL = 0.4, LAND = DROP_AT + FALL;

      tl.fromTo(pod, { y: -820 }, { y: 0, duration: FALL, ease: "power2.in" }, DROP_AT);
      tl.set(pod, { scaleX: 0.9, scaleY: 1.14 }, DROP_AT);
      echoes.forEach(function (e, i) {
        var lag = 0.035 * (i + 1);
        tl.fromTo(e, { y: -820 }, { y: 0, duration: FALL, ease: "power2.in" }, DROP_AT + lag);
        tl.set(e, { scaleX: 0.9, scaleY: 1.14 }, DROP_AT);
        tl.set(e, { opacity: 0 }, LAND);
      });
      tl.to(shadow, { opacity: 0.16, duration: FALL, ease: "power2.in" }, DROP_AT);
      tl.fromTo(shadow, { scale: 0.35 }, { scale: 1, duration: FALL, ease: "power2.in" }, DROP_AT);
      tl.set(shadow, { opacity: 0 }, LAND);

      // Squash on impact, then one smooth recover (no repeated bounce).
      tl.to(pod, { scaleX: 1.2, scaleY: 0.74, duration: 0.06, ease: "power1.out" }, LAND);
      tl.to(pod, { scaleX: 1, scaleY: 1, duration: 0.5, ease: "power3.out" }, LAND + 0.06);

      // The slab takes the hit: a small dip and settle.
      tl.to(H.nodes.w2, { y: 5, duration: 0.06, ease: "power1.out" }, LAND);
      tl.to(H.nodes.w2, { y: 0, duration: 0.45, ease: "power3.out" }, LAND + 0.06);

      // Thin blue ground ripple expanding and fading on the slab plane.
      var r0 = 30, r1 = 104;
      tl.set(ripple, { opacity: 0.9, attr: { rx: r0 * 1.2247 * K.S, ry: r0 * 0.7071 * K.S } }, LAND);
      tl.to(
        ripple,
        { opacity: 0, attr: { rx: r1 * 1.2247 * K.S, ry: r1 * 0.7071 * K.S, "stroke-width": 1 }, duration: 0.7, ease: "power2.out" },
        LAND
      );

      // LED: Pending (amber) → Running (green).
      tl.to(led, { attr: { fill: C.green }, duration: 0.18, ease: "none" }, 2.32);

      // ---------- Scene 3 (2.6–4.0s): lockup lands top-centre ----------
      var mark = byId("mark");
      var inner = byId("mark-inner");
      tl.fromTo(mark, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 2.6);
      tl.fromTo(inner, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2.78);

      // Wordmark: waterfall-entry per letter (binary arrival, whip up from below, gaps shrink).
      var letters = byId("wordmark").querySelectorAll('[class~="02-cluster-reveal-letter"]');
      var steps = [0.085, 0.08, 0.075, 0.07, 0.065, 0.06];
      var t = 2.8;
      for (var i = 0; i < letters.length; i++) {
        var yOff = i === 0 ? 70 : Math.max(44, 64 - i * 3);
        var dur = i === 0 ? 0.2 : Math.max(0.14, 0.18 - i * 0.006);
        tl.fromTo(letters[i], { opacity: 0 }, { opacity: 1, duration: F, ease: "none" }, t);
        tl.fromTo(letters[i], { y: yOff }, { y: 0, duration: dur, ease: "power4.out" }, t);
        if (i < steps.length) t += steps[i];
      }

      // Tagline rises word by word in slate.
      var words = byId("tagline").querySelectorAll('[class~="02-cluster-reveal-word"]');
      for (var j = 0; j < words.length; j++) {
        tl.fromTo(
          words[j],
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          3.3 + j * 0.08
        );
      }

      // ---------- Scene 4 (4.0–5.0s): held read, everything still ----------
      tl.to({}, { duration: 0.001 }, 4.999);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
