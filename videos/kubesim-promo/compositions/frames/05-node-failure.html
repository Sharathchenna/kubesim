    <svg data-hf-id="hf-o40n" id="05-node-failure-stage" viewBox="0 0 1080 1080" width="1080" height="1080" xmlns="http://www.w3.org/2000/svg" data-layout-allow-overflow="" />

    <div data-hf-id="hf-eu6b" id="05-node-failure-cap1" class="05-node-failure-cap">

    <div data-hf-id="hf-66ag" id="05-node-failure-cap2" class="05-node-failure-cap">
      <span data-hf-id="hf-vksl" id="05-node-failure-w2a" class="05-node-failure-word">Its</span>
      <span data-hf-id="hf-xmqi" id="05-node-failure-w2b" class="05-node-failure-word">Pods</span>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/iso-kit.js"></script>
  <script>
    (function () {
      var FID = "05-node-failure";
      var DUR = 8.5;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      var byId = function (s) {
        return root.querySelector('[id="' + FID + "-" + s + '"]');
      };
      var K = window.IsoKit;
      var C = K.COLORS;
      var S = K.S;
      var tl = gsap.timeline({ paused: true });

      // Shared dot-grid ground (identical to sibling cluster frames).
      byId("bg").style.cssText += K.DOT_GRID_CSS;

      // ---------------------------------------------------------------- stage
      var svg = byId("stage");
      var defs = K.el("defs", {}, svg);
      var shakeG = K.el("g", { id: FID + "-shake" }, svg);
      var camG = K.el("g", { id: FID + "-cam" }, shakeG);
      var H = K.buildCluster(camG, { prefix: FID, pods: { w1: [1, 2], w2: [1, 3], w3: [1, 2] } });

      var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
      var seg = function (t, a, b) { return clamp01((t - a) / (b - a)); };
      var smooth = function (a, b, v) { var x = clamp01((v - a) / (b - a)); return x * x * (3 - 2 * x); };
      var inOut2 = gsap.parseEase("power2.inOut");
      var out2 = gsap.parseEase("power2.out");
      var faces = function (g) { return g.querySelectorAll("polygon"); }; // [left, right, top]
      var led = function (g) { return g.querySelector(".led"); };
      var podTransform = function (g, x, y, sx, sy) {
        var bx = +g.dataset.bx, by = +g.dataset.by;
        g.setAttribute(
          "transform",
          "translate(" + (x + bx).toFixed(2) + " " + (y + by).toFixed(2) + ") scale(" + sx.toFixed(4) + " " + sy.toFixed(4) + ") translate(" + (-bx).toFixed(2) + " " + (-by).toFixed(2) + ")"
        );
      };
      var show = function (g, on) { g.setAttribute("visibility", on ? "inherit" : "hidden"); };
      var polyLen = function (pts) {
        var L = 0;
        for (var i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        return L;
      };

      // ------------------------------------------------ worker-3 RGB-split ghosts
      var W3 = K.origin("w3");
      var glitchGhosts = [["#F87171", 0.55], ["#60A5FA", 0.55]].map(function (spec) {
        var col = spec[0];
        var g = K.el("g", { opacity: spec[1], visibility: "hidden" });
        K.box(g, W3[0], W3[1], 0, K.NODE_W, K.NODE_W, K.NODE_H, [col, col, col]);
        [1, 2].forEach(function (k) {
          var s = K.slot("w3", k);
          K.box(g, s[0], s[1], K.NODE_H, K.POD, K.POD, K.POD, [col, col, col]);
        });
        H.nodes.w3.insertBefore(g, H.slab.w3);
        return g;
      });

      // ------------------------------------------------------ crack (top face)
      var crackDefs = [
        [[40, 0], [70, 60], [120, 90], [110, 150], [170, 200]],
        [[120, 90], [150, 76], [184, 88]],
      ];
      var cracks = crackDefs.map(function (uv) {
        var pts = uv.map(function (p) { return K.P(W3[0] + p[0], W3[1] + p[1], K.NODE_H); });
        var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(2) + "," + p[1].toFixed(2); }).join(" ");
        var path = K.el("path", {
          d: d, fill: "none", stroke: C.red, "stroke-width": 3,
          "stroke-linejoin": "round", "stroke-linecap": "round",
        });
        H.nodes.w3.insertBefore(path, H.pods.w3);
        var len = polyLen(pts) * 1.02;
        path.style.strokeDasharray = len + " " + len;
        path.style.strokeDashoffset = len;
        return path;
      });

      // ------------------------------------------------------- evicted Pods
      var SINK = 30 * S;                  // Node sink in screen px
      var LIFT = (160 - K.NODE_H) * S;    // lift to ~160 world units
      var HALF = (K.POD / 2) * S;         // base → cube centre
      var airPaths = K.el("g", { id: FID + "-air-paths" }, H.air);
      var airEchoes = K.el("g", { id: FID + "-air-echoes" }, H.air);
      var airPods = K.el("g", { id: FID + "-air-pods" }, H.air);
      var uArc = function (p) { return 0.3 * p + 0.7 * p * p; }; // accelerates into the landing

      var EV = [
        { k: 2, src: H.podEls.w3[1], tn: "w2", tk: 0, tLift0: 3.75, tLift1: 4.15, tLand: 4.8, arch: 90, tDraw0: 3.85, tDraw1: 4.3, tGhost: 3.45 },
        { k: 1, src: H.podEls.w3[0], tn: "w1", tk: 3, tLift0: 4.0, tLift1: 4.4, tLand: 5.35, arch: 150, tDraw0: 4.1, tDraw1: 4.6, tGhost: 3.57 },
      ];

      EV.forEach(function (ev, i) {
        ev.tArc0 = ev.tLift1;
        ev.arcDur = ev.tLand - ev.tArc0;
        var B0 = K.podBase("w3", ev.k), B1 = K.podBase(ev.tn, ev.tk);
        var L = [0, SINK - LIFT];
        var E = [B1[0] - B0[0], B1[1] - B0[1]];
        var Cc = [(L[0] + E[0]) / 2, Math.min(L[1], E[1]) - ev.arch];
        ev.bez = function (u) {
          var a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u;
          return [a * L[0] + b * Cc[0] + c * E[0], a * L[1] + b * Cc[1] + c * E[1]];
        };
        ev.L = L;
        // arc-length table so the route erases exactly behind the Pod
        var N = 160, lens = [0], prev = ev.bez(0);
        for (var j = 1; j <= N; j++) {
          var cur = ev.bez(j / N);
          lens.push(lens[j - 1] + Math.hypot(cur[0] - prev[0], cur[1] - prev[1]));
          prev = cur;
        }
        ev.len = lens[N];
        ev.sAt = function (u) {
          var f = clamp01(u) * N, j0 = Math.floor(f), j1 = Math.min(N, j0 + 1);
          return lens[j0] + (lens[j1] - lens[j0]) * (f - j0);
        };

        // target layer: ripple, ghost outline, landed Pod — at the correct depth
        var layer = H.pods[ev.tn];
        var before = ev.tk === 0 ? layer.firstChild : null;
        var ts = K.slot(ev.tn, ev.tk);
        var cx = ts[0] + K.POD / 2, cy = ts[1] + K.POD / 2;
        ev.ring = K.isoRing(layer, cx, cy, K.NODE_H, 24, { stroke: C.blue[1], "stroke-width": 2.5, opacity: 0, visibility: "hidden" });
        ev.ghost = K.ghostPod(layer, ev.tn, ev.tk, { id: FID + "-ghost-" + ev.tn + "-" + ev.tk });
        ev.ghost.setAttribute("opacity", 0);
        ev.landed = K.addPod(layer, ev.tn, ev.tk, { id: FID + "-landed-" + ev.tn + "-" + ev.tk, colors: C.grey, led: C.soft });
        [ev.ring, ev.ghost, ev.landed].forEach(function (n) { layer.insertBefore(n, before); });
        show(ev.landed, false);
        gsap.set(ev.landed, { svgOrigin: ev.landed.dataset.bx + " " + ev.landed.dataset.by });

        // self-drawing dashed route (masked so the draw + tail erase are exact)
        var c0 = [B0[0] + L[0], B0[1] + L[1] - HALF];
        var c1 = [B0[0] + Cc[0], B0[1] + Cc[1] - HALF];
        var c2 = [B0[0] + E[0], B0[1] + E[1] - HALF];
        var d = "M" + c0.join(",") + " Q" + c1.join(",") + " " + c2.join(",");
        var mask = K.el("mask", { id: FID + "-route-mask-" + i, maskUnits: "userSpaceOnUse", x: -200, y: -200, width: 1480, height: 1480 }, defs);
        ev.maskPath = K.el("path", { d: d, fill: "none", stroke: "#fff", "stroke-width": 14, visibility: "hidden" }, mask);
        K.el("path", {
          d: d, fill: "none", stroke: C.muted, "stroke-width": 3, "stroke-dasharray": "8 8",
          opacity: 0.85, mask: "url(#" + FID + "-route-mask-" + i + ")",
        }, airPaths);

        // echo trail + the airborne Pod itself (kit air layer = correct depth in flight)
        ev.echoes = [[0.07, 0.34], [0.14, 0.17]].map(function (spec) {
          var g = K.addPod(airEchoes, "w3", ev.k, { colors: C.grey, led: C.soft });
          show(g, false);
          return { g: g, lag: spec[0], op: spec[1] };
        });
        ev.air = K.addPod(airPods, "w3", ev.k, { colors: C.grey, led: C.soft });
        show(ev.air, false);
      });

      // ------------------------------------------------ camera + glitch + flight
      var CAM_O = K.nodeCenter("w3");
      var CAM_S = 1.06, CAM_IN0 = 0.2, CAM_IN1 = 1.3, CAM_OUT0 = 3.2, CAM_OUT1 = 4.0;
      var SHAKES = [[1.3, 0.18, 3], [2.05, 0.42, 8]];                                 // [start, dur, px]
      var BURSTS = [[0.3, 0.14, 0.35], [0.62, 0.16, 0.6], [0.92, 0.12, 0.8], [1.08, 0.22, 1]]; // [start, dur, peak]
      var JITTER = 1 / 20, MAX_SPLIT = 16;

      function render(t) {
        // camera: one writer (push-in on worker-3, return as the Pods travel)
        var s = t < CAM_OUT0
          ? 1 + (CAM_S - 1) * inOut2(seg(t, CAM_IN0, CAM_IN1))
          : CAM_S - (CAM_S - 1) * inOut2(seg(t, CAM_OUT0, CAM_OUT1));
        camG.setAttribute("transform",
          "translate(" + CAM_O[0].toFixed(2) + " " + CAM_O[1].toFixed(2) + ") scale(" + s.toFixed(5) + ") translate(" + (-CAM_O[0]).toFixed(2) + " " + (-CAM_O[1]).toFixed(2) + ")");
        var sx = 0, sy = 0, qs = Math.floor(t * 30);
        SHAKES.forEach(function (sh, n) {
          if (t >= sh[0] && t < sh[0] + sh[1]) {
            var a = sh[2] * Math.pow(1 - (t - sh[0]) / sh[1], 2);
            sx += a * (K.hash(qs * 7 + n * 31 + 1) * 2 - 1);
            sy += a * 0.6 * (K.hash(qs * 11 + n * 17 + 3) * 2 - 1);
          }
        });
        shakeG.setAttribute("transform", "translate(" + sx.toFixed(2) + " " + sy.toFixed(2) + ")");

        // RGB-split glitch: quantized time × deterministic hash × burst envelope
        var amp = 0;
        BURSTS.forEach(function (b) {
          if (t >= b[0] && t < b[0] + b[1]) {
            var p = (t - b[0]) / b[1];
            amp = Math.max(amp, b[2] * (1 - p * p * p));
          }
        });
        var step = Math.floor(t / JITTER);
        glitchGhosts.forEach(function (g, layerIdx) {
          if (amp > 0) {
            var jx = (K.hash(step * 13 + layerIdx * 7) * 2 - 1) * MAX_SPLIT * amp;
            var jy = (K.hash(step * 29 + layerIdx * 11) * 2 - 1) * MAX_SPLIT * 0.35 * amp;
            g.setAttribute("transform", "translate(" + jx.toFixed(2) + " " + jy.toFixed(2) + ")");
            show(g, true);
          } else {
            g.setAttribute("transform", "translate(0 0)");
            show(g, false);
          }
        });

        // evicted Pods: lift → arc along the route → hand off to the landed copy
        EV.forEach(function (ev) {
          var flying = t >= ev.tLift0 && t < ev.tLand;
          show(ev.src, t < ev.tLift0);
          show(ev.air, flying);
          show(ev.landed, t >= ev.tLand);
          show(ev.ring, t >= ev.tLand);
          show(ev.ghost, t < ev.tLand);
          var p = (t - ev.tArc0) / ev.arcDur; // unclamped for the echo tail
          if (flying) {
            var x, y, scx = 1, scy = 1;
            if (t < ev.tLift1) {
              var pl = seg(t, ev.tLift0, ev.tLift1);
              x = 0;
              y = SINK + (ev.L[1] - SINK) * out2(pl);
              var st = Math.sin(Math.PI * pl);
              scx = 1 - 0.05 * st;
              scy = 1 + 0.12 * st;
            } else {
              var q = ev.bez(uArc(clamp01(p)));
              x = q[0];
              y = q[1];
              var kf = smooth(0.55, 1, p);
              scx = 1 - 0.06 * kf;
              scy = 1 + 0.12 * kf;
            }
            podTransform(ev.air, x, y, scx, scy);
          } else {
            podTransform(ev.air, 0, t < ev.tLift0 ? SINK : 0, 1, 1);
          }
          ev.echoes.forEach(function (e) {
            var pe = p - e.lag;
            if (pe > 0 && pe < 1) {
              var qe = ev.bez(uArc(pe));
              podTransform(e.g, qe[0], qe[1], 1, 1);
              e.g.setAttribute("opacity", (e.op * Math.sin(Math.PI * pe)).toFixed(3));
              show(e.g, true);
            } else {
              show(e.g, false);
            }
          });
          // route: head draws ahead, tail erases just behind the Pod
          var head = t < ev.tLand ? ev.len * out2(seg(t, ev.tDraw0, ev.tDraw1)) : 0;
          var tail = t >= ev.tArc0 ? Math.max(0, ev.sAt(uArc(clamp01(p))) - 14) : 0;
          if (head - tail > 0.5) {
            ev.maskPath.setAttribute("stroke-dasharray", (head - tail).toFixed(2) + " " + (ev.len * 3).toFixed(2));
            ev.maskPath.setAttribute("stroke-dashoffset", (-tail).toFixed(2));
            show(ev.maskPath, true);
          } else {
            show(ev.maskPath, false);
          }
        });
      }
      render(0);
      var drv = { t: 0 };
      tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(drv.t); } }, 0);

      // ------------------------------------------------ Scene 1: "A Node dies."
      var waterfall = function (items) {
        items.forEach(function (it) {
          var el = byId(it[0]);
          tl.set(el, { opacity: 1, y: it[2] }, it[1]);
          tl.to(el, { y: 0, duration: it[3], ease: "power4.out" }, it[1]);
        });
      };
      waterfall([["w1a", 0.12, 48, 0.13], ["w1b", 0.22, 80, 0.19], ["w1c", 0.38, 60, 0.16]]);

      // ------------------------------------------------ Scene 2: red, crack, sink
      var slabFaces = faces(H.slab.w3);
      var RED_ORDER = [C.nodeRed[1], C.nodeRed[2], C.nodeRed[0]];
      slabFaces.forEach(function (f, n) {
        tl.to(f, { attr: { fill: RED_ORDER[n], stroke: "#FCA5A5" }, duration: 0.14, ease: "power1.out" }, 1.3);
      });
      tl.to(H.label.w3, { attr: { fill: "#991B1B" }, duration: 0.14, ease: "power1.out" }, 1.3);
      tl.to(cracks[0], { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 1.36);
      tl.to(cracks[1], { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, 1.36 + 0.45 * 0.75);
      tl.to(H.nodes.w3, { y: SINK, duration: 0.55, ease: "power2.in" }, 1.5); // impact at 2.05 → shake

      var GREY_ORDER = [C.grey[1], C.grey[2], C.grey[0]];
      EV.forEach(function (ev, n) {
        var t0 = 1.62 + n * 0.12;
        faces(ev.src).forEach(function (f, m) {
          tl.to(f, { attr: { fill: GREY_ORDER[m] }, duration: 0.5, ease: "power2.out" }, t0);
        });
        tl.to(led(ev.src), { attr: { fill: C.soft }, duration: 0.3, ease: "power2.out" }, t0);
      });

      var chipDown = byId("chip-down");
      tl.fromTo(chipDown, { opacity: 0, y: 14, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 2.15);

      // ------------------------------------------------ Scene 3: "Its Pods move."
      waterfall([["w2a", 3.25, 48, 0.14], ["w2b", 3.36, 80, 0.19], ["w2c", 3.53, 60, 0.16]]);

      var BLUE_ORDER = [C.blue[1], C.blue[2], C.blue[0]];
      EV.forEach(function (ev) {
        tl.fromTo(ev.ghost, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, ev.tGhost);
        // squash on impact, one smooth recover (no bounce)
        tl.fromTo(ev.landed, { scaleX: 1.22, scaleY: 0.7 }, { scaleX: 1, scaleY: 1, duration: 0.42, ease: "power3.out" }, ev.tLand);
        // thin ground ripple
        var r0 = 24, r1 = 82;
        tl.fromTo(
          ev.ring,
          { attr: { rx: r0 * 1.2247 * S, ry: r0 * 0.7071 * S }, opacity: 0.85 },
          { attr: { rx: r1 * 1.2247 * S, ry: r1 * 0.7071 * S }, opacity: 0, duration: 0.65, ease: "power2.out", immediateRender: false },
          ev.tLand
        );
        // Running again: blue faces, green LED
        faces(ev.landed).forEach(function (f, m) {
          tl.to(f, { attr: { fill: BLUE_ORDER[m] }, duration: 0.3, ease: "power2.out" }, ev.tLand + 0.06);
        });
        tl.to(led(ev.landed), { attr: { fill: C.green }, duration: 0.2, ease: "power2.out" }, ev.tLand + 0.2);
