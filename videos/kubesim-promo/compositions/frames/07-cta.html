  <script>
    (function () {
      var $ = function (id) { return document.getElementById("07-cta-" + id); };
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–1.0s): Pod cube drops, lands, morphs into the kubesim mark ----
      var drop = $("drop"), morph = $("morph");
      var BASE = "540 392.6"; // cube's bottom vertex at scale 1.15 (squash origin)
      var LAND = 0.38;

      // fall: gravity ease, slight stretch while airborne
      tl.fromTo(drop,
        { y: -560, scaleX: 0.92, scaleY: 1.1, svgOrigin: BASE },
        { y: 0, scaleX: 0.92, scaleY: 1.1, svgOrigin: BASE, duration: LAND, ease: "power2.in" }, 0);
      // impact squash, then one smooth recover (no repeated bounce)
      tl.fromTo(drop,
        { scaleX: 0.92, scaleY: 1.1, svgOrigin: BASE },
        { scaleX: 1.14, scaleY: 0.84, svgOrigin: BASE, duration: 0.07, ease: "power2.out", immediateRender: false }, LAND);
      tl.fromTo(drop,
        { scaleX: 1.14, scaleY: 0.84, svgOrigin: BASE },
        { scaleX: 1, scaleY: 1, svgOrigin: BASE, duration: 0.32, ease: "power3.out", immediateRender: false }, LAND + 0.07);

      // thin ground ripple ring on impact
      tl.set($("ripple-g"), { visibility: "inherit" }, LAND);
      tl.fromTo($("ripple"),
        { attr: { rx: 80, ry: 46 }, strokeWidth: 3, opacity: 0.7 },
        { attr: { rx: 240, ry: 139 }, strokeWidth: 1, opacity: 0, duration: 0.62, ease: "power2.out" }, LAND);

      // card-morph-anchor: uniform scale + paint crossfade in lockstep, one ease
      var M0 = 0.58, MD = 0.42;
      tl.fromTo(morph, { scale: 1.15, svgOrigin: "540 300" },
        { scale: 1, svgOrigin: "540 300", duration: MD, ease: "power2.inOut" }, M0);
      tl.fromTo($("ink"), { opacity: 0 }, { opacity: 1, duration: MD, ease: "power2.inOut" }, M0);
      // old content (status LED) out in the first ~40%
      tl.fromTo($("led"), { opacity: 1 }, { opacity: 0, duration: MD * 0.4, ease: "power1.in" }, M0);
      // new content: the white inner hexagon self-draws in the back of the morph
      var outline = $("outline");
      tl.fromTo(outline, { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, M0 + MD * 0.6);
      tl.set(outline, { attr: { "stroke-dasharray": "none" } }, M0 + MD * 0.6 + 0.46);

      // ---- Scene 2 (1.0–1.9s): wordmark waterfall, tagline rises per phrase ----
      var letters = document.querySelectorAll('[id="07-cta-word"] [class~="07-cta-letter"]');
      var travel = [72, 50, 50, 46, 46, 40, 56];
      var dur = [0.18, 0.16, 0.16, 0.15, 0.15, 0.13, 0.16];
      var gaps = [0.07, 0.06, 0.055, 0.05, 0.045, 0.04];
      var t = 1.05;
      for (var i = 0; i < letters.length; i++) {
        tl.set(letters[i], { opacity: 1, y: travel[i] }, t);
        tl.to(letters[i], { y: 0, duration: dur[i], ease: "power4.out" }, t);
        t += gaps[i] || 0;
      }

      var phrases = document.querySelectorAll('[id="07-cta-tag"] [class~="07-cta-phrase"]');
      for (var p = 0; p < phrases.length; p++) {
        tl.fromTo(phrases[p], { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.4 + p * 0.07);
      }

      // ---- Scene 3 (1.9–3.2s): terminal pill pops in, stretches, types, prints ----
      var term = $("term");
      tl.fromTo(term,
        { opacity: 0, scale: 0.6, transformOrigin: "50% 50%", clipPath: "inset(0px 285px 0px 285px round 18px)" },
        { opacity: 1, scale: 1, transformOrigin: "50% 50%", clipPath: "inset(0px 285px 0px 285px round 18px)", duration: 0.2, ease: "power3.out" }, 1.9);
      tl.fromTo(term,
        { clipPath: "inset(0px 285px 0px 285px round 18px)" },
        { clipPath: "inset(0px 0px 0px 0px round 18px)", duration: 0.4, ease: "expo.out", immediateRender: false }, 2.0);

      tl.set($("prompt"), { opacity: 1 }, 2.12);
      tl.set($("caret1"), { opacity: 1 }, 2.12);

      var cmd = "kubectl apply -f you.yaml";
      var cmdEl = $("cmd");
      for (var c = 0; c < cmd.length; c++) {
        var ch = document.createElement("span");
        ch.textContent = cmd[c];
        ch.style.display = "none";
        cmdEl.appendChild(ch);
        tl.set(ch, { display: "inline" }, 2.22 + c * 0.022);
      }

      // enter: caret leaves line 1, output prints green at 2.9s
      tl.set($("caret1"), { opacity: 0 }, 2.85);
      tl.set($("line2"), { opacity: 1 }, 2.9);

      // ---- Scene 4 (3.2–4.0s): still end card, caret blinks once ----
      tl.set($("caret2"), { opacity: 0 }, 3.35);
      tl.set($("caret2"), { opacity: 1 }, 3.6);
      tl.set({}, {}, 4);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-cta"] = tl;
    })();
  </script>
