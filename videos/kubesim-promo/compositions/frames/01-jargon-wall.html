          <span data-hf-id="hf-jk9o" id="01-jargon-wall-cool" aria-hidden="true">Pods?</span>

        <div data-hf-id="hf-eexz" id="01-jargon-wall-line-2">what you can’t <span data-hf-id="hf-u557" id="01-jargon-wall-see">see.</span></div>

  <script>
    (function () {
      const FRAME_ID = "01-jargon-wall";
      const $ = (s) => document.getElementById(FRAME_ID + "-" + s);
      const tl = gsap.timeline({ paused: true });

      // Deterministic hash — pure function of its input (no Math.random).
      const glitchHash = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      // ---------------- Scene 1 (0.0–2.2s): hard-cut word-swap, accelerating ----------------
      const SEQUENCE = [
        { t: 0.0, text: "Pods?" },
        { t: 0.5, text: "ReplicaSets?" },
        { t: 0.9, text: "Controllers?" },
        { t: 1.25, text: "Schedulers?" },
        { t: 1.55, text: "etcd?" },
        { t: 1.8, text: "Endpoints?" },
        { t: 2.0, text: "kube-proxy?" },
      ];
      const JAM_START = 2.2; // Scene 2: the slot jams
      const IMPACT = 2.42; // hero slams, chips blast out

      // chromatic-glitch (emphasis-burst form) tokens
      const GLITCH_DUR = 0.16;
      const JITTER_STEP = 1 / 24;
      const MAX_SPLIT = 8;
      const SPLIT_OPACITY = 0.5; // unblended on light ground
      // tiny scale punch per swap
      const PUNCH = 0.07;
      const PUNCH_DUR = 0.24;
      // jam shake
      const JAM_SHAKE = 18;

      const slot = $("slot");
      const glitch = $("glitch");
      const base = $("base");
      const copies = [$("warm"), $("cool")];
      const texts = [base].concat(copies);

      // Reverse-search for the latest state whose t has passed.
      function stateAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return i;
        }
        return 0;
      }

      let shownIdx = -1;
      const drv = { t: 0 };
      function renderSlot(t) {
        const idx = stateAt(t);
        if (idx !== shownIdx) {
          // discrete jump — instant, no transition
          texts.forEach((el) => (el.textContent = SEQUENCE[idx].text));
          shownIdx = idx;
        }
        const dt = t - SEQUENCE[idx].t;
        const step = Math.floor(t / JITTER_STEP); // quantized time — the stutter

        // amplitude envelope: snaps to 1 at each swap, power3.in-shaped decay to 0
        let amp = dt < GLITCH_DUR ? 1 - Math.pow(dt / GLITCH_DUR, 3) : 0;
        // jam: interference builds toward the impact
        let jam = 0;
        if (t >= JAM_START) {
          jam = Math.min(1, (t - JAM_START) / (IMPACT - JAM_START));
          amp = Math.max(amp, 0.55 + 0.45 * jam);
        }

        copies.forEach((el, layer) => {
          if (amp > 0) {
            const jx = (glitchHash(step * 13 + layer * 7) * 2 - 1) * MAX_SPLIT * amp;
            const jy = (glitchHash(step * 29 + layer * 11) * 2 - 1) * MAX_SPLIT * 0.35 * amp;
            gsap.set(el, { x: jx, y: jy, opacity: SPLIT_OPACITY });
          } else {
            // clean resolve — clamp to exact rest
            gsap.set(el, { x: 0, y: 0, opacity: 0 });
          }
        });

        // scale punch on each swap (skip the entrance state; it has its own glitch-stretch)
        const pp = Math.min(1, dt / PUNCH_DUR);
        const punch = idx === 0 ? 1 : 1 + PUNCH * Math.pow(1 - pp, 3);
        gsap.set(glitch, { scale: punch });

        // fast lateral jam shake, quantized, ramping up
        const sx = jam > 0 ? (glitchHash(step * 31 + 5) * 2 - 1) * JAM_SHAKE * (0.4 + 0.6 * jam) : 0;
        gsap.set(slot, { x: sx });
      }

      // "Pods?" enters glitching (glitch-stretch entrance) — visible well before 0.5s
      tl.fromTo(
        slot,
        { scaleX: 1.5, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.3, ease: "power4.out" },
        0,
      );
      // entrance envelope for the first state
      const entryAmp = { a: 1 };
      tl.fromTo(
        entryAmp,
        { a: 1 },
        {
          a: 0,
          duration: 0.3,
          ease: "power3.in",
          onUpdate: () => {
            const t = tl.time();
            if (t > 0.3) return;
            const step = Math.floor(t / JITTER_STEP);
            copies.forEach((el, layer) => {
              const jx = (glitchHash(step * 13 + layer * 7) * 2 - 1) * MAX_SPLIT * entryAmp.a;
              const jy = (glitchHash(step * 29 + layer * 11) * 2 - 1) * MAX_SPLIT * 0.35 * entryAmp.a;
              gsap.set(el, { x: jx, y: jy, opacity: entryAmp.a > 0.001 ? SPLIT_OPACITY : 0 });
            });
          },
        },
        0,
      );
      tl.set(copies, { x: 0, y: 0, opacity: 0 }, 0.3);

      // one linear driver renders the discrete sequence + glitch bursts + punch + jam
      tl.fromTo(
        drv,
        { t: 0.3 },
        {
          t: IMPACT,
          duration: IMPACT - 0.3,
          ease: "none",
          onUpdate: () => renderSlot(drv.t),
        },
        0.3,
      );

      // ---------------- Scene 2 (2.2–2.7s): impact ----------------
      // slot is struck and replaced — its words become the blasted chips
      tl.set(copies, { x: 0, y: 0, opacity: 0 }, IMPACT);
      tl.set(slot, { autoAlpha: 0, x: 0 }, IMPACT);

      // kinetic-beat-slam: line 1 scale+blur slam (power4.out), line 2 a second, tighter hit (expo.out)
      tl.fromTo(
        $("line-1"),
        { scale: 1.6, filter: "blur(16px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
        IMPACT,
      );
      tl.fromTo(
        $("line-2"),
        { scale: 1.3, y: 24, filter: "blur(10px)", opacity: 0 },
        { scale: 1, y: 0, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "expo.out" },
        IMPACT + 0.1,
      );

      // center-outward-expansion: six chips blast from the slot to the corners
      const START_PROGRESS = 0.12;
      const EXPAND_DUR = 1.1;
      const STAGGER = 0.04;
      const chips = ["pods", "rs", "ctrl", "sched", "etcd", "ep"].map((k) => $("chip-" + k));
      chips.forEach((el, i) => {
        const tx = Number(el.dataset.targetX);
        const ty = Number(el.dataset.targetY);
        const at = IMPACT + i * STAGGER;
        tl.fromTo(
          el,
          {
            xPercent: -50,
            yPercent: -50,
            x: tx * START_PROGRESS,
            y: ty * START_PROGRESS,
            scaleX: 1.55,
            scaleY: 0.6,
            opacity: 0,
          },
          {
            x: tx,
            y: ty,
            scaleX: 1,
            scaleY: 1,
            opacity: 1,
            duration: EXPAND_DUR,
            ease: "expo.out",
          },
          at,
        );
        // brief blur that resolves as they settle
        tl.fromTo(
          el,
          { filter: "blur(9px)" },
          { filter: "blur(0px)", duration: 0.42, ease: "power3.out" },
          at,
        );
      });

      // impact shake on the stage — quantized, decaying, returns to exact rest
      const SHAKE_DUR = 0.22;
      const shake = { a: 0 };
      const stage = $("stage");
      tl.fromTo(
        shake,
        { a: 1 },
        {
          a: 0,
          duration: SHAKE_DUR,
          ease: "power2.in",
          onUpdate: () => {
            const step = Math.floor(tl.time() / (1 / 30));
            gsap.set(stage, {
              x: (glitchHash(step * 17 + 3) * 2 - 1) * 10 * shake.a,
              y: (glitchHash(step * 23 + 9) * 2 - 1) * 6 * shake.a,
            });
          },
        },
        IMPACT,
      );
      tl.set(stage, { x: 0, y: 0 }, IMPACT + SHAKE_DUR);

      // ---------------- Scene 3 (2.7–4.5s): held read ----------------
      tl.fromTo(
        $("see"),
        { color: "#0F172A" },
        { color: "#3B82F6", duration: 0.6, ease: "power2.out" },
        3.1,
      );

      // pin the timeline to the frame's full duration (held read to 4.5s)
      tl.set({}, {}, 4.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
